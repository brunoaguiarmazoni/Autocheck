services:
  db:
    image: postgres:16-alpine
    container_name: autocheck_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autocheck_db
    ports:
      - "5432:5432"
    volumes:
      - autocheck_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autocheck_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/autocheck_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-autocheck-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: 2h
      BACKEND_PORT: 3001
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autocheck_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  autocheck_pgdata:
