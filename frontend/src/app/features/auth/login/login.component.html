<div class="min-h-screen flex items-center justify-center bg-surface py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-surface-container-low p-10 rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] border border-outline-variant">
    <div>
      <h2 class="mt-2 text-center text-3xl font-semibold text-text-primary tracking-wide">
        Entrar na sua conta
      </h2>
    </div>
    
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
      <span class="block sm:inline">{{ errorMessage }}</span>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="rounded-lg shadow-sm -space-y-px">
        <div>
          <label for="email-address" class="sr-only">E-mail</label>
          <input id="email-address" formControlName="email" type="email" autocomplete="email" required
            class="appearance-none rounded-none relative block w-full px-4 py-3 border border-outline-variant bg-surface-container-lowest placeholder-text-secondary text-text-primary rounded-t-lg focus:outline-none focus:ring-primary focus:border-primary focus:z-10 text-base"
            placeholder="E-mail">
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-alert text-xs mt-1 px-2 font-medium">
            E-mail inválido ou obrigatório.
          </div>
        </div>
        <div>
          <label for="password" class="sr-only">Senha</label>
          <input id="password" formControlName="password" type="password" autocomplete="current-password" required
            class="appearance-none rounded-none relative block w-full px-4 py-3 border border-outline-variant bg-surface-container-lowest placeholder-text-secondary text-text-primary rounded-b-lg focus:outline-none focus:ring-primary focus:border-primary focus:z-10 text-base"
            placeholder="Senha">
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-alert text-xs mt-1 px-2 font-medium">
            A senha é obrigatória.
          </div>
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid || isLoading"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-250">
          {{ isLoading ? 'Entrando...' : 'Entrar' }}
        </button>
      </div>
      
      <div class="text-center mt-6">
        <a routerLink="/auth/register" class="font-semibold text-primary hover:text-primary-container text-sm transition-colors duration-250">
          Ainda não tem uma conta? Cadastre-se
        </a>
      </div>
    </form>
  </div>
</div>
