<div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
  <div class="sm:flex sm:items-start">
    <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
      <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
        {{ maintenance ? 'Editar Manutenção' : 'Nova Manutenção' }}
      </h3>
      
      <div *ngIf="error" class="mt-2 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm">
        {{ error }}
      </div>

      <div class="mt-4">
        <form [formGroup]="maintenanceForm" (ngSubmit)="onSubmit()" class="space-y-4">
          
          <div>
            <label for="date" class="block text-sm font-medium text-gray-700">Data *</label>
            <input type="date" id="date" formControlName="date"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              [ngClass]="{'border-red-500': maintenanceForm.get('date')?.invalid && maintenanceForm.get('date')?.touched}">
            <p *ngIf="maintenanceForm.get('date')?.invalid && maintenanceForm.get('date')?.touched" class="mt-1 text-sm text-red-600">
              A data é obrigatória.
            </p>
          </div>

          <div>
            <label for="type" class="block text-sm font-medium text-gray-700">Tipo *</label>
            <select id="type" formControlName="type"
              class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
              <option value="Preventiva">Preventiva</option>
              <option value="Corretiva">Corretiva</option>
            </select>
          </div>

          <div>
            <label for="cost" class="block text-sm font-medium text-gray-700">Custo (R$) *</label>
            <input type="number" id="cost" formControlName="cost" step="0.01" min="0"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              [ngClass]="{'border-red-500': maintenanceForm.get('cost')?.invalid && maintenanceForm.get('cost')?.touched}">
            <p *ngIf="maintenanceForm.get('cost')?.invalid && maintenanceForm.get('cost')?.touched" class="mt-1 text-sm text-red-600">
              O custo é obrigatório e deve ser maior ou igual a zero.
            </p>
          </div>

          <div>
            <label for="description" class="block text-sm font-medium text-gray-700">Descrição</label>
            <textarea id="description" formControlName="description" rows="3"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
<div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-lg">
  <button type="button" (click)="onSubmit()" [disabled]="loading"
    class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50">
    <span *ngIf="loading" class="mr-2">Salvando...</span>
    <span *ngIf="!loading">Salvar</span>
  </button>
  <button type="button" (click)="onCancel()" [disabled]="loading"
    class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50">
    Cancelar
  </button>
</div>
