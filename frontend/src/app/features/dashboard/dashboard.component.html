<div class="container mx-auto p-4 max-w-6xl md:my-12">
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end mb-12 gap-4">
    <div>
      <div class="flex items-center gap-4">
        <h1 class="text-4xl font-semibold text-text-primary tracking-wide">Dashboard</h1>
        <a routerLink="/vehicles" class="inline-flex items-center px-4 py-2 border border-primary text-sm font-medium rounded-lg text-primary bg-transparent hover:bg-surface-dim transition-colors duration-250">Meus Veículos</a>
        <button (click)="logout()" class="inline-flex items-center px-4 py-2 border border-alert text-sm font-medium rounded-lg text-alert bg-transparent hover:bg-red-50 transition-colors duration-250">Sair</button>
      </div>
      <p class="text-text-secondary mt-2 text-lg">Visão geral do seu veículo.</p>
    </div>
    
    <div class="w-full sm:w-72" *ngIf="vehicles.length > 0">
      <label for="vehicleSelect" class="block text-xs font-medium text-text-secondary uppercase tracking-widest mb-2">Selecione o Veículo</label>
      <select id="vehicleSelect" [(ngModel)]="selectedVehicleId" (change)="onVehicleChange()" class="block w-full pl-4 pr-10 py-3 text-base border-outline-variant bg-surface-container-lowest focus:outline-none focus:ring-primary focus:border-primary rounded-lg transition-colors shadow-sm">
        <option *ngFor="let v of vehicles" [value]="v.id">{{ v.brand }} {{ v.model }} ({{ v.licensePlate }})</option>
      </select>
    </div>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6" role="alert">
    <span class="block sm:inline">{{ error }}</span>
  </div>

  <div *ngIf="loading" class="flex justify-center my-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!loading && vehicles.length === 0 && !error" class="bg-surface-container-low rounded-xl border border-outline-variant p-16 text-center shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
    <svg class="mx-auto h-16 w-16 text-outline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <h3 class="mt-6 text-xl font-semibold text-text-primary">Nenhum veículo encontrado</h3>
    <p class="mt-2 text-text-secondary mb-8 text-lg">Adicione um veículo para ver o resumo aqui.</p>
    <a routerLink="/vehicles/new" class="inline-flex items-center px-8 py-3 border border-transparent text-sm font-medium rounded-lg text-on-primary bg-primary hover:bg-primary-container transition-colors duration-250">
      Cadastrar Veículo
    </a>
  </div>

  <div *ngIf="!loading && summary">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Detalhes e Status -->
      <div class="md:col-span-1">
        <app-vehicle-stats [vehicle]="summary.vehicle" [totalExpenses]="summary.totalExpenses"></app-vehicle-stats>
      </div>
      
      <!-- Previsões e Histórico -->
      <div class="md:col-span-2 space-y-6">
        <app-upcoming-maintenances [maintenances]="summary.upcomingMaintenances"></app-upcoming-maintenances>
        <app-recent-maintenances [maintenances]="summary.recentMaintenances"></app-recent-maintenances>
      </div>

    </div>
  </div>
</div>
