<div class="container mx-auto p-4">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Meus Veículos</h1>
    <a routerLink="/vehicles/new" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm transition-colors">
      + Novo Veículo
    </a>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
    <span class="block sm:inline">{{ error }}</span>
  </div>

  <div *ngIf="loading" class="flex justify-center my-8">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!loading && vehicles.length === 0 && !error" class="bg-white rounded-lg shadow-sm p-8 text-center border border-gray-200">
    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
    </svg>
    <h3 class="mt-2 text-sm font-medium text-gray-900">Nenhum veículo cadastrado</h3>
    <p class="mt-1 text-sm text-gray-500">Comece adicionando seu primeiro veículo.</p>
    <div class="mt-6">
      <a routerLink="/vehicles/new" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
        Adicionar Veículo
      </a>
    </div>
  </div>

  <div *ngIf="!loading && vehicles.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let vehicle of vehicles" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow">
      <div class="p-5">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-lg font-bold text-gray-900">{{ vehicle.brand }} {{ vehicle.model }}</h3>
            <p class="text-sm text-gray-500">{{ vehicle.year }}</p>
          </div>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
            {{ vehicle.licensePlate }}
          </span>
        </div>
        
        <div class="mt-4 flex items-center text-sm text-gray-600">
          <svg class="flex-shrink-0 mr-1.5 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          {{ vehicle.currentMileage | number }} km
        </div>
      </div>
      
      <div class="bg-gray-50 px-5 py-3 border-t border-gray-200 flex justify-end space-x-3">
        <a [routerLink]="['/vehicles/edit', vehicle.id]" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition-colors">
          Editar
        </a>
        <button (click)="deleteVehicle(vehicle.id)" class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">
          Excluir
        </button>
      </div>
    </div>
  </div>
</div>
