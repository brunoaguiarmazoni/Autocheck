<div class="container mx-auto p-4 max-w-6xl md:my-12">
  <div class="flex justify-between items-center mb-12">
    <div class="flex items-center gap-4">
      <h1 class="text-4xl font-semibold text-text-primary tracking-wide">Meus Veículos</h1>
      <a routerLink="/dashboard" class="inline-flex items-center px-4 py-2 border border-primary text-sm font-medium rounded-lg text-primary bg-transparent hover:bg-surface-dim transition-colors duration-250">Dashboard</a>
      <button (click)="logout()" class="inline-flex items-center px-4 py-2 border border-alert text-sm font-medium rounded-lg text-alert bg-transparent hover:bg-red-50 transition-colors duration-250">Sair</button>
    </div>
    <a routerLink="/vehicles/new" class="bg-primary hover:bg-primary-container text-on-primary font-medium py-3 px-6 rounded-lg shadow-sm transition-colors duration-250">
      + Novo Veículo
    </a>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
    <span class="block sm:inline">{{ error }}</span>
  </div>

  <div *ngIf="loading" class="flex justify-center my-8">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!loading && vehicles.length === 0 && !error" class="bg-surface-container-low rounded-xl border border-outline-variant p-16 text-center shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
    <svg class="mx-auto h-16 w-16 text-outline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
    </svg>
    <h3 class="mt-6 text-xl font-semibold text-text-primary">Nenhum veículo cadastrado</h3>
    <p class="mt-2 text-text-secondary text-lg">Comece adicionando seu primeiro veículo.</p>
    <div class="mt-8">
      <a routerLink="/vehicles/new" class="inline-flex items-center px-8 py-3 border border-transparent shadow-sm text-sm font-medium rounded-lg text-on-primary bg-primary hover:bg-primary-container transition-colors duration-250">
        Adicionar Veículo
      </a>
    </div>
  </div>

  <div *ngIf="!loading && vehicles.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let vehicle of vehicles" class="bg-surface-container-low rounded-xl border border-outline-variant shadow-[0_2px_8px_rgba(0,0,0,0.02)] overflow-hidden transition-transform duration-250 hover:-translate-y-1 flex flex-col">
      <div class="p-6 flex-grow">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-xl font-semibold text-text-primary">{{ vehicle.brand }} {{ vehicle.model }}</h3>
            <p class="text-text-secondary mt-1">{{ vehicle.year }}</p>
          </div>
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-surface-dim text-text-primary tracking-wider">
            {{ vehicle.licensePlate }}
          </span>
        </div>
        
        <div class="mt-6 flex items-center text-sm text-text-secondary">
          <svg class="flex-shrink-0 mr-2 h-5 w-5 text-text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          <span class="text-base">{{ vehicle.currentMileage | number }} km</span>
        </div>
      </div>
      
      <div class="bg-surface-container-lowest px-6 py-4 border-t border-outline-variant flex justify-end space-x-4">
        <a [routerLink]="['/vehicles', vehicle.id]" class="text-sm font-medium text-primary hover:text-primary-container transition-colors duration-250">
          Ver Detalhes
        </a>
        <a [routerLink]="['/vehicles/edit', vehicle.id]" class="text-sm font-medium text-primary hover:text-primary-container transition-colors duration-250">
          Editar
        </a>
        <button (click)="deleteVehicle(vehicle.id)" class="text-sm font-medium text-alert hover:text-red-700 transition-colors duration-250">
          Excluir
        </button>
      </div>
    </div>
  </div>
</div>
