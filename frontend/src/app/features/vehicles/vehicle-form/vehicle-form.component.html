<div class="container mx-auto p-4 max-w-2xl">
  <div class="mb-6 flex items-center">
    <a routerLink="/vehicles" class="text-gray-500 hover:text-gray-700 mr-4">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </a>
    <h1 class="text-2xl font-bold text-gray-800">
      {{ isEditMode ? 'Editar Veículo' : 'Novo Veículo' }}
    </h1>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6" role="alert">
    <span class="block sm:inline">{{ error }}</span>
  </div>

  <div *ngIf="loading" class="flex justify-center my-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!loading" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 md:p-8">
    <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="brand" class="block text-sm font-medium text-gray-700">Marca</label>
          <input type="text" id="brand" formControlName="brand" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                 [ngClass]="{'border-red-300': isFieldInvalid('brand')}">
          <p *ngIf="isFieldInvalid('brand')" class="mt-1 text-sm text-red-600">A marca é obrigatória.</p>
        </div>

        <div>
          <label for="model" class="block text-sm font-medium text-gray-700">Modelo</label>
          <input type="text" id="model" formControlName="model" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                 [ngClass]="{'border-red-300': isFieldInvalid('model')}">
          <p *ngIf="isFieldInvalid('model')" class="mt-1 text-sm text-red-600">O modelo é obrigatório.</p>
        </div>

        <div>
          <label for="year" class="block text-sm font-medium text-gray-700">Ano</label>
          <input type="number" id="year" formControlName="year" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                 [ngClass]="{'border-red-300': isFieldInvalid('year')}">
          <p *ngIf="isFieldInvalid('year')" class="mt-1 text-sm text-red-600">Ano inválido.</p>
        </div>

        <div>
          <label for="licensePlate" class="block text-sm font-medium text-gray-700">Placa</label>
          <input type="text" id="licensePlate" formControlName="licensePlate" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border uppercase"
                 [ngClass]="{'border-red-300': isFieldInvalid('licensePlate')}">
          <p *ngIf="isFieldInvalid('licensePlate')" class="mt-1 text-sm text-red-600">A placa é obrigatória.</p>
        </div>

        <div class="md:col-span-2">
          <label for="currentMileage" class="block text-sm font-medium text-gray-700">Quilometragem Atual (km)</label>
          <input type="number" id="currentMileage" formControlName="currentMileage" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                 [ngClass]="{'border-red-300': isFieldInvalid('currentMileage')}">
          <p *ngIf="isFieldInvalid('currentMileage')" class="mt-1 text-sm text-red-600">Quilometragem inválida.</p>
        </div>
      </div>

      <div class="pt-4 flex justify-end space-x-3">
        <a routerLink="/vehicles" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Cancelar
        </a>
        <button type="submit" [disabled]="submitting" 
                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
          <svg *ngIf="submitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Salvar
        </button>
      </div>
    </form>
  </div>
</div>
