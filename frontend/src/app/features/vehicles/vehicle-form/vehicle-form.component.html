<div class="container mx-auto p-4 max-w-2xl md:my-12">
  <div class="mb-10 flex items-center">
    <a routerLink="/vehicles" class="text-primary hover:text-primary-container mr-4 transition-colors duration-250">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </a>
    <h1 class="text-3xl font-semibold text-text-primary tracking-wide">
      {{ isEditMode ? 'Editar Veículo' : 'Novo Veículo' }}
    </h1>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6" role="alert">
    <span class="block sm:inline">{{ error }}</span>
  </div>

  <div *ngIf="loading" class="flex justify-center my-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!loading" class="bg-surface-container-low rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-outline-variant p-8 md:p-10">
    <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="space-y-8">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div>
          <label for="brand" class="block text-xs font-semibold text-text-secondary uppercase tracking-widest mb-2">Marca</label>
          <input type="text" id="brand" formControlName="brand" 
                 class="block w-full rounded-lg bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-primary text-text-primary text-base p-3 border transition-colors shadow-sm"
                 [ngClass]="{'border-alert': isFieldInvalid('brand')}">
          <p *ngIf="isFieldInvalid('brand')" class="mt-2 text-sm text-alert">A marca é obrigatória.</p>
        </div>

        <div>
          <label for="model" class="block text-xs font-semibold text-text-secondary uppercase tracking-widest mb-2">Modelo</label>
          <input type="text" id="model" formControlName="model" 
                 class="block w-full rounded-lg bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-primary text-text-primary text-base p-3 border transition-colors shadow-sm"
                 [ngClass]="{'border-alert': isFieldInvalid('model')}">
          <p *ngIf="isFieldInvalid('model')" class="mt-2 text-sm text-alert">O modelo é obrigatório.</p>
        </div>

        <div>
          <label for="year" class="block text-xs font-semibold text-text-secondary uppercase tracking-widest mb-2">Ano</label>
          <input type="number" id="year" formControlName="year" 
                 class="block w-full rounded-lg bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-primary text-text-primary text-base p-3 border transition-colors shadow-sm"
                 [ngClass]="{'border-alert': isFieldInvalid('year')}">
          <p *ngIf="isFieldInvalid('year')" class="mt-2 text-sm text-alert">Ano inválido.</p>
        </div>

        <div>
          <label for="licensePlate" class="block text-xs font-semibold text-text-secondary uppercase tracking-widest mb-2">Placa</label>
          <input type="text" id="licensePlate" formControlName="licensePlate" 
                 class="block w-full rounded-lg bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-primary text-text-primary text-base p-3 border uppercase transition-colors shadow-sm"
                 [ngClass]="{'border-alert': isFieldInvalid('licensePlate')}">
          <p *ngIf="isFieldInvalid('licensePlate')" class="mt-2 text-sm text-alert">A placa é obrigatória.</p>
        </div>

        <div class="md:col-span-2">
          <label for="currentMileage" class="block text-xs font-semibold text-text-secondary uppercase tracking-widest mb-2">Quilometragem Atual (km)</label>
          <input type="number" id="currentMileage" formControlName="currentMileage" 
                 class="block w-full rounded-lg bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-primary text-text-primary text-base p-3 border transition-colors shadow-sm"
                 [ngClass]="{'border-alert': isFieldInvalid('currentMileage')}">
          <p *ngIf="isFieldInvalid('currentMileage')" class="mt-2 text-sm text-alert">Quilometragem inválida.</p>
        </div>
      </div>

      <div class="pt-6 flex justify-end space-x-4">
        <a routerLink="/vehicles" class="bg-transparent py-3 px-6 border border-primary rounded-lg shadow-sm text-sm font-medium text-primary hover:bg-surface-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
          Cancelar
        </a>
        <button type="submit" [disabled]="submitting" 
                class="inline-flex justify-center items-center py-3 px-8 border border-transparent shadow-sm text-sm font-medium rounded-lg text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 transition-colors">
          <svg *ngIf="submitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-on-primary" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Salvar
        </button>
      </div>
    </form>
  </div>
</div>
